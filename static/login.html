<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Simulador FUNDEB v2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-main, #f4f6f9); }
    .login-card { max-width: 420px; width: 100%; }
  </style>
</head>
<body>
  <div class="login-card card shadow-sm">
    <div class="card-header text-center py-3">
      <h4 class="mb-0"><i class="fas fa-graduation-cap"></i> Simulador FUNDEB v2</h4>
      <small class="text-muted">Acesso com CPF e senha</small>
    </div>
    <div class="card-body p-4">
      <form id="form-login">
        <div class="mb-3">
          <label for="login-cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="login-cpf" placeholder="000.000.000-00" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label for="login-senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="login-senha" required autocomplete="current-password">
        </div>
        <div id="login-erro" class="text-danger small mb-2"></div>
        <button type="submit" class="btn btn-primary w-100" id="btn-login">
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>
    </div>
    <div class="card-footer text-center small text-muted">
      Desenvolvido pelo IFCE — prof. João Cláudio Nunes Carvalho
    </div>
  </div>
  <script src="/static/js/auth.js"></script>
</body>
</html>
