<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários — Simulador FUNDEB v2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
<nav id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h4><i class="fas fa-graduation-cap"></i> FUNDEB</h4>
    <span class="sidebar-subtitle">Administração de usuários</span>
  </div>
  <ul class="sidebar-nav">
    <li><a href="/"><i class="fas fa-arrow-left"></i> <span>Voltar ao simulador</span></a></li>
    <li class="active"><i class="fas fa-users"></i> <span>Usuários</span></li>
  </ul>
  <div id="sidebar-user" class="sidebar-user px-3 py-2 d-none"></div>
  <div class="sidebar-footer">
    <a href="#" id="btn-logout" class="sidebar-logout"><i class="fas fa-sign-out-alt"></i> Sair</a>
  </div>
</nav>

<main id="main-content" class="main-content">
  <div class="topbar">
    <h5><i class="fas fa-users"></i> Cadastro de usuários</h5>
  </div>

  <div class="container-fluid py-3">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card card-input">
          <div class="card-header"><i class="fas fa-user-plus"></i> Novo usuário</div>
          <div class="card-body">
            <form id="form-usuario">
              <div class="mb-3">
                <label for="usr-cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="usr-cpf" placeholder="000.000.000-00" required>
              </div>
              <div class="mb-3">
                <label for="usr-nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="usr-nome">
              </div>
              <div class="mb-3">
                <label for="usr-senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="usr-senha" minlength="6" required>
              </div>
              <div class="mb-3">
                <label for="usr-role" class="form-label">Perfil</label>
                <select class="form-select" id="usr-role">
                  <option value="usuario">Usuário</option>
                  <option value="admin">Administrador</option>
                </select>
              </div>
              <div id="form-erro" class="text-danger small mb-2"></div>
              <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Cadastrar</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header"><i class="fas fa-list"></i> Usuários cadastrados</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-striped table-hover mb-0">
                <thead>
                  <tr>
                    <th>CPF</th>
                    <th>Nome</th>
                    <th>Perfil</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody id="usuarios-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modal editar usuário -->
<div class="modal fade" id="modal-editar-usuario" tabindex="-1" aria-labelledby="modal-editar-label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-editar-label"><i class="fas fa-user-edit"></i> Editar usuário</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="form-editar-usuario">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" class="form-control" id="edit-cpf" readonly disabled>
          </div>
          <div class="mb-3">
            <label for="edit-nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="edit-nome" autocomplete="name">
          </div>
          <div class="mb-3">
            <label for="edit-role" class="form-label">Perfil</label>
            <select class="form-select" id="edit-role">
              <option value="usuario">Usuário</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="edit-senha" class="form-label">Nova senha</label>
            <input type="password" class="form-control" id="edit-senha" minlength="6" autocomplete="new-password" placeholder="Deixe em branco para não alterar">
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="edit-ativo">
            <label class="form-check-label" for="edit-ativo">Usuário ativo</label>
          </div>
          <div id="edit-erro" class="text-danger small"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
